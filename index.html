<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reedah's Emporium</title>
<meta name="description" content="Reedah's Emporium — exact reference storefront">
<style>
html,body{margin:0;background:#fff;min-height:100%;font-family:Arial,sans-serif}*{box-sizing:border-box}.stage{width:min(100vw,1024px);margin:0 auto;position:relative;line-height:0}.stage img{display:block;width:100%;height:auto}.hit{position:absolute;background:transparent;border:0;padding:0;margin:0;cursor:pointer;z-index:5}.drawer{position:fixed;top:0;right:-430px;width:min(430px,100vw);height:100vh;background:#fff;z-index:20;box-shadow:-20px 0 60px rgba(0,0,0,.2);transition:right .25s ease;line-height:1.4;padding:26px;overflow:auto}.drawer.open{right:0}.drawer h2{margin:0 0 10px;font:700 28px Georgia,serif}.drawer p{color:#666}.drawer .row{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid #eee;font-size:14px}.drawer button.cta{width:100%;border:0;background:#d84d7c;color:#fff;padding:14px;border-radius:8px;font-weight:700;cursor:pointer}.close{position:absolute;right:16px;top:12px;border:0;background:none;color:#222;font-size:28px;cursor:pointer}.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19;display:none}.backdrop.open{display:block}.status{position:fixed;left:10px;bottom:10px;z-index:30;background:rgba(255,255,255,.92);padding:7px 10px;border-radius:6px;font:12px Arial;color:#666;display:none}@media(max-width:600px){.drawer{width:92vw}.status{display:none}}
</style></head>
<body>
<div class="stage" id="stage"><img id="reference" alt="Reedah's Emporium">
  <!-- Invisible interaction layer over the exact supplied design -->
  <button class="hit" style="left:77%;top:4%;width:20%;height:5%" aria-label="Order via WhatsApp" onclick="quickWA()"></button>
  <button class="hit" style="left:72%;top:4%;width:5%;height:5%" aria-label="Open bag" onclick="openCart()"></button>
  <button class="hit" style="left:56%;top:30%;width:41%;height:8%" aria-label="Select shade" onclick="openCart('Lip Gloss')"></button>
  <button class="hit" style="left:59%;top:42.5%;width:30%;height:4.5%" aria-label="Add gloss to bag" onclick="addGloss()"></button>
  <button class="hit" style="left:6%;top:76.5%;width:18%;height:3%" onclick="add('Lip Gloss',3000,'Nude')" aria-label="Add lip gloss"></button>
  <button class="hit" style="left:24%;top:76.5%;width:18%;height:3%" onclick="add('Lip Oil',2000,'')" aria-label="Add lip oil"></button>
  <button class="hit" style="left:42%;top:76.5%;width:18%;height:3%" onclick="add('Lip Scrub',1500,'')" aria-label="Add lip scrub"></button>
  <button class="hit" style="left:60%;top:76.5%;width:18%;height:3%" onclick="add('Lip Liner',1500,'')" aria-label="Add lip liner"></button>
  <button class="hit" style="left:78%;top:76.5%;width:18%;height:3%" onclick="add('Lip Balm',1000,'')" aria-label="Add lip balm"></button>
  <button class="hit" style="left:69%;top:88%;width:26%;height:4%" onclick="quickWA()" aria-label="Order via WhatsApp"></button>
</div>
<div id="backdrop" class="backdrop" onclick="closeCart()"></div>
<aside id="cart" class="drawer" aria-live="polite"><button class="close" onclick="closeCart()">×</button><h2>Your Bag</h2><p>Orders are sent directly to Reedah's on WhatsApp.</p><div id="items"></div><div class="row" style="font-weight:700"><span>Total</span><span id="total">₦0</span></div><button class="cta" onclick="checkout()">Continue to WhatsApp →</button></aside>
<script>
const PARTS=['part1','part2','part3','part4'];let cart=[];
async function loadReference(){const parts=[];for(const p of PARTS){const r=await fetch('/assets/exact-page-'+p+'.txt',{cache:'no-store'});if(!r.ok)throw new Error('Missing image part '+p);parts.push((await r.text()).trim())}document.getElementById('reference').src='data:image/webp;base64,'+parts.join('')}
const money=n=>'₦'+n.toLocaleString();
function add(name,price,shade=''){const existing=cart.find(x=>x.name===name&&x.shade===shade);if(existing)existing.qty++;else cart.push({name,price,shade,qty:1});render();openCart()}
function addGloss(){add('Lip Gloss',3000,'Nude')}
function render(){document.getElementById('items').innerHTML=cart.length?cart.map((x,i)=>`<div class="row"><span><b>${x.name}</b>${x.shade?`<br><small>Shade: ${x.shade}</small>`:''}<br><small>Qty: ${x.qty}</small></span><span>${money(x.price*x.qty)}<br><button onclick="cart.splice(${i},1);render()" style="border:0;background:none;color:#d84d7c;cursor:pointer">Remove</button></span></div>`).join(''):'<p>Your bag is empty.</p>';document.getElementById('total').textContent=money(cart.reduce((s,x)=>s+x.price*x.qty,0))}
function openCart(){document.getElementById('cart').classList.add('open');document.getElementById('backdrop').classList.add('open')}
function closeCart(){document.getElementById('cart').classList.remove('open');document.getElementById('backdrop').classList.remove('open')}
function quickWA(){window.open('https://wa.me/2348121757186?text='+encodeURIComponent("Hi Reedah's! 💕 I'd like to place an order."),'_blank')}
function checkout(){if(!cart.length){quickWA();return}const lines=cart.map(x=>`• ${x.qty} × ${x.name}${x.shade?' — '+x.shade:''} — ${money(x.price*x.qty)}`).join('\n');const total=money(cart.reduce((s,x)=>s+x.price*x.qty,0));const msg=`Hi Reedah's! 💕\n\nI'd like to place an order.\n\n${lines}\n\nTotal: ${total}\n\nPlease confirm my order and delivery details.`;window.open('https://wa.me/2348121757186?text='+encodeURIComponent(msg),'_blank')}
render();loadReference().catch(()=>{document.getElementById('reference').alt='Reedah reference image failed to load';});
</script></body></html>
