<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reedah's Emporium</title>
<meta name="description" content="Reedah's Emporium">
<style>
html,body{margin:0;background:#fff;min-height:100%;font-family:Arial,sans-serif}
*{box-sizing:border-box}
.stage{width:min(100vw,1024px);margin:0 auto;position:relative;line-height:0}
.stage>img{display:block;width:100%;height:auto}
.hit{position:absolute;display:block;background:transparent;border:0;padding:0;margin:0;cursor:pointer;z-index:5}
.drawer{position:fixed;top:0;right:-420px;width:min(420px,100vw);height:100vh;background:#fff;z-index:20;box-shadow:-20px 0 50px rgba(0,0,0,.15);transition:right .25s ease;line-height:1.4;padding:24px;overflow:auto}
.drawer.open{right:0}
.drawer h2{margin:0 0 15px;font-family:Georgia,serif}
.drawer .row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee;font-size:14px}
.drawer button{border:0;background:#d84d7c;color:white;padding:13px 16px;border-radius:8px;font-weight:700;cursor:pointer}
.close{position:absolute;right:16px;top:12px;background:none!important;color:#222!important;font-size:24px;padding:4px!important}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19;display:none}
.backdrop.open{display:block}
@media(max-width:600px){.drawer{width:92vw}}
</style>
</head>
<body>
<div class="stage" id="stage">
<img src="data:image/webp;base64,UklGRkQqAABXRUJQVlA4WAoAAAAQAAAQAAAQQUxQSC4qAACQAgCdASoQABAAAgA0JaQAA3AA/vuUAAA==" alt="Reedah's Emporium website preview">
</div>
<script>/* reference image is embedded by the deployment build */</script>
</body>
</html>
